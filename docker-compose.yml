services:
  postgres:
    image: postgres:18
    container_name: balderdash-postgres
    env_file: ./server/.env
    ports:
      - '5433:5432'
    volumes:
      - balderdash-pg-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  balderdash-pg-data:
